# 运维智能台账系统 Nginx 站点配置（统信 UOS / Debian）
# 放置到 /etc/nginx/conf.d/ops-ledger.conf 或 sites-enabled，然后 nginx -t && systemctl reload nginx

server {
    listen 80;
    # 生产环境改为服务器实际域名/IP
    server_name _;

    # 附件上传上限（需 >= 后端 MAX_UPLOAD_MB）
    client_max_body_size 25m;

    # 前端静态资源（npm run build 产物）
    root /opt/ops-ledger/frontend/dist;
    index index.html;

    # SPA 路由：未命中静态文件时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API（含附件下载 /api/v1/attachments/... ，已带鉴权）
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
